# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title                    : "Hyunsoo Kim"
description              : "Ph.D. student in ECE at UT Austin, working on generative models for visual understanding."
url                      : "https://gustn9609.github.io"
baseurl                  : ""
repository               : "gustn9609/gustn9609.github.io"

google_analytics_id      : "G-CQVGENQ4WN"

# ---------------------------------------------------------------------------
# Author / profile
# ---------------------------------------------------------------------------
author:
  name             : "Hyunsoo Kim"
  avatar           : "assets/img/avatar.png"
  email            : "climba@utexas.edu"
  cv               : "/assets/files/curriculum_vitae3.pdf"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=huI5ip8AAAAJ"
  github           : "gustn9609"
  linkedin         : "hyunsoo-kim-b28a67202"
  twitter          :   # e.g. "hyunsookim" (handle only) — leave blank to hide the icon

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
include:
  - _pages
  - assets
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - README_de.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - index.md.old
  - html_source_file
  - vendor
  - node_modules
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

permalink: /:title/
timezone: America/Chicago

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
